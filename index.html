<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projectdocumentatie</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #262342;
    --accent: #78b7ff;
    --background: linear-gradient(135deg, #1f1c2c, #928dab);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: var(--background);
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--primary);
}

/* ================= Container ================= */
.container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 1000px;
    width: 90%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
}

h1 {
    font-weight: 600;
    font-size: 2.5rem;
}

h2 {
    font-weight: 400;
    margin-bottom: 40px;
    color: #555;
}

h3 {
    margin-top: 50px;
    font-weight: 400;
}

/* ================= Knoppen ================= */
.knoppen-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 30px;
    margin-bottom: 30px;
}

.knop {
    height: 100px; /* groter gemaakt voor extra tekst */
    padding: 10px 20px;
    border: none;
    border-radius: 35px; 
    font-size: 1.1rem;
    font-weight: 500;
    cursor: pointer;
    background: var(--primary);
    color: white;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column; /* tekst onder elkaar */
    justify-content: center;
    align-items: center;
    text-align: center;
}

.knop:hover {
    background: var(--accent);
    transform: translateY(-6px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.knop:active {
    transform: scale(0.96);
}

.knop-ondertekst {
    font-size: 0.8rem; /* kleinere ondertekst */
    margin-top: 4px;
    color: #7a9eaf; 
}

/* ================= Hamburger menu ================= */
.hamburger-menu {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
}

.hamburger {
    font-size: 30px;
    background: var(--primary);
    color: white;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.menu {
    margin-top: 12px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    display: none;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
}

.menu a {
    display: block;
    margin: 10px 0;
    text-decoration: none;
    font-weight: 500;
    color: var(--primary);
    transition: color 0.2s ease;
}

.menu a:hover {
    color: var(--accent);
}

@media (max-width: 600px) {
    h1 { font-size: 2rem; }
    .knop { height: 90px; font-size: 1rem; }
}
</style>
</head>
<body>

<!-- Hamburger menu -->
<div class="hamburger-menu">
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <nav class="menu" id="menu">
        <a href="Week1.html">Week 1</a>
        <a href="Week2.html">Week 2</a>
        <a href="Week3.html">Week 3</a>
        <a href="Week4.html">Week 4</a>
        <a href="Week5.html">Week 5</a>
        <a href="Week6.html">Week 6</a>
        <a href="Week7.html">Week 7</a>
        <a href="Week8.html">Week 8</a>
        <a href="Week9.html">Week 9</a>
        <a href="Week10.html">Week 10</a>
        <a href="Week11.html">Week 11</a>
        <a href="Week12.html">Week 12</a>
        <a href="Week13.html">Week 13</a>
    </nav>
</div>

<div class="container">
    <h1>Maxime Samsom – 1GDM2</h1>
    <h2>Projectdocumentatie</h2>

    <div class="knoppen-container">
        <button class="knop" onclick="location.href='Week1.html'">
            Week 1
            <span class="knop-ondertekst">Onderzoek & ontwerpfase 1</span>
        </button>
        <button class="knop" onclick="location.href='Week2.html'">
            Week 2
            <span class="knop-ondertekst">Tweede schetsen</span>
        </button>
        <button class="knop" onclick="location.href='Week3.html'">
            Week 3
            <span class="knop-ondertekst">Eerste mid-fi schetsen</span>
        </button>
        <button class="knop" onclick="location.href='Week4.html'">
            Week 4
            <span class="knop-ondertekst">Tweede mid-fi schetsen</span>
        </button>
        <button class="knop" onclick="location.href='Week5.html'">
            Week 5
            <span class="knop-ondertekst">ChatGPT</span>
        </button>
        <button class="knop" onclick="location.href='Week6.html'">
            Week 6
            <span class="knop-ondertekst">Leren coderen & aanvullen site</span>
        </button>
        <button class="knop" onclick="location.href='Week7.html'">
            Week 7
            <span class="knop-ondertekst">Vakantie</span>
        </button>
        <button class="knop" onclick="location.href='Week8.html'">
            Week 8
            <span class="knop-ondertekst">Examens</span>
        </button>
        <button class="knop" onclick="location.href='Week9.html'">
            Week 9
            <span class="knop-ondertekst">Brugdag</span>
        </button>
        <button class="knop" onclick="location.href='Week10.html'">
            Week 10
            <span class="knop-ondertekst">Interactieve Figma schermen voor de smartphone</span>
        </button>
        <button class="knop" onclick="location.href='Week11.html'">
            Week 11
            <span class="knop-ondertekst">Interactiviteit van de schermen</span>
        </button>
        <button class="knop" onclick="location.href='Week12.html'">
            Week 12
            <span class="knop-ondertekst">Extra info</span>
        </button>
        <button class="knop" onclick="location.href='Week13.html'">
            Week 13
            <span class="knop-ondertekst">Extra info</span>
        </button>
    </div>

    <h3>Documentatie treinschermen</h3>
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById('menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}
</script>

</body>
</html>
