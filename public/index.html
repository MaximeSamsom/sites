<style>
/* Body en container */
body {
    font-family: Arial, sans-serif;
    background-size: cover;
    text-align: center;
    margin: 0;
}

.container {
    background: rgba(255, 255, 255, 0.705);
    padding: 30px;
    border-radius: 15px;
    backdrop-filter: blur(6px);
    max-width: 900px;
    margin: 40px auto;
}

h1, h2, h3 {
    margin: 15px 0;
}

/* Knoppen-container */
.knoppen-container {
    display: flex;
    justify-content: center;
    gap: 60px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

/* Trein knop */
.knop {
    width: 140px;
    height: 70px;
    font-size: 18px;
    cursor: pointer;
    background-color: #262342;
    color: white;
    border: none;
    border-radius: 25px 15px 15px 15px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s, background-color 0.3s;
}

.knop:hover {
    background-color: #ce94c9;
    transform: translateY(-5px);
}

.knop:active {
    transform: scale(0.95);
}

/* Wielen */
.knop::before,
.knop::after {
    content: "";
    position: absolute;
    bottom: -12px;
    width: 20px;
    height: 20px;
    background: #262342;
    border-radius: 50%;
    border: 2px solid #000;
}

.knop::before {
    left: 15px;
}

.knop::after {
    right: 15px;
}

.knop:first-child {
    border-radius: 30px 15px 15px 15px;
}

/* Responsive */
@media (max-width: 1024px) {
    .knop {
        width: 120px;
        height: 60px;
        font-size: 12px;
    }
}

@media (max-width: 600px) {
    .knop {
        width: 100px;
        height: 50px;
        font-size: 10px;
    }
}

/* ========================= */
/* Hamburger menu styling   */
/* ========================= */
.hamburger-menu {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
}

.hamburger {
    font-size: 32px;
    cursor: pointer;
    background: #262342;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
}

.menu {
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 10px;
    padding: 15px;
    display: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.menu a {
    display: block;
    text-decoration: none;
    color: #262342;
    font-weight: bold;
    margin: 8px 0;
}

.menu a:hover {
    color: #ce94c9;
}
</style>
</head>
